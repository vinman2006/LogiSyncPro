<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ls-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#E84E0F" />
    </linearGradient>
    <filter id="ls-icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7C2D12" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Logo Mark (Concept 1: Signal + Motion) -->
  <g transform="translate(4, 4) scale(0.64)">
    <!-- Squircle Base -->
    <rect width="100" height="100" rx="24" fill="url(#ls-brand-grad)" />

    <!-- Signal + Motion Waves -->
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <path d="M 57 28 C 66 28 75 32 80 39" stroke-width="3.5" />
      <path d="M 61 35 C 67 35 73 38 76 43" stroke-width="3" />
    </g>

    <!-- Sparkle -->
    <path d="M 77 34 C 77 31.5 78.5 30 81 30 C 78.5 30 77 28.5 77 26 C 77 28.5 75.5 30 73 30 C 75.5 30 77 31.5 77 34 Z" fill="#FFFFFF" />

    <!-- Truck Silhouette -->
    <g fill="#FFFFFF" filter="url(#ls-icon-shadow)">
      <path d="M 23 44 C 20.8 44 19 45.8 19 48 L 19 65.5 C 19 66.3 19.7 67 20.5 67 L 24 67 C 24.5 64.2 27 62 30 62 C 33 62 35.5 64.2 36 67 L 49 67 C 49.6 67 50 66.6 50 66 L 50 45.5 C 50 44.7 49.3 44 48.5 44 Z" />
      <path d="M 52.5 49 C 52.5 48.2 53.1 47.5 53.9 47.5 L 61.5 47.5 C 62.6 47.5 63.6 48.1 64.2 49.1 L 69.8 57.5 C 70.3 58.2 70.5 59.1 70.5 60 L 70.5 65.5 C 70.5 66.3 69.8 67 69 67 L 66 67 C 65.5 64.2 63 62 60 62 C 57 62 54.5 64.2 54 67 L 53.5 67 C 52.9 67 52.5 66.6 52.5 66 Z" />
    </g>

    <!-- Windshield -->
    <path d="M 54.5 50.5 L 60.5 50.5 C 61.3 50.5 62 50.9 62.4 51.6 L 66.2 57.5 L 54.5 57.5 Z" fill="url(#ls-brand-grad)" />

    <!-- Wheels -->
    <g fill="#FFFFFF">
      <circle cx="30" cy="67.5" r="4.8" />
      <circle cx="30" cy="67.5" r="2.2" fill="url(#ls-brand-grad)" />
      <circle cx="60" cy="67.5" r="4.8" />
      <circle cx="60" cy="67.5" r="2.2" fill="url(#ls-brand-grad)" />
    </g>
  </g>

  <!-- Typography: LogiSync -->
  <text x="80" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="-0.5">
    LogiSync
  </text>

  <!-- Badge: PRO pill (Concept 1 style) -->
  <g transform="translate(80, 47)">
    <rect width="46" height="17" rx="8.5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="23" y="12" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="9.5" fill="#475569" letter-spacing="1" text-anchor="middle">
      PRO
    </text>
  </g>
</svg>
